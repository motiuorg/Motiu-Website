# Landing-page content — structure + copy from Andrea's prepared landing (origin/andrea).
# The three pillars frame the org's three capabilities:
#   tissue → Network coordination · neural → Collective intelligence · flow → Regenerative finance
hero:
  # Rotating headline: the first word of the title swaps every 2s (list below).
  # Per-locale titles — EN is the default; CA/ES pages still serve EN copy
  # elsewhere (i18n rewrite fallback), so only the headline is localized for now.
  title:
    en: Infrastructure for territorial regeneration
    ca: Infraestructura per a la regeneració territorial
    es: Infraestructura para la regeneración territorial
  # Word rotation: one entry per rotating word, translated per locale.
  # The first entry must match the first word of the matching title above
  # (it's the initial render; the JS rotation then reshuffles the order).
  rotate:
    - { en: Infrastructure, ca: Infraestructura, es: Infraestructura }
    - { en: Intelligence, ca: Intel·ligència, es: Inteligencia }
    - { en: Networks, ca: Xarxes, es: Redes }
    - { en: Financing, ca: Finançament, es: Financiación }
    - { en: Capacitation, ca: Capacitació, es: Capacitación }
    - { en: Strategies, ca: Estratègies, es: Estrategias }
  tagline: >-
    Regenerative work fails when it runs on separate tracks — projects in isolation, ecological
    and social goals apart, finance that can't follow a transition through decades. We design
    and run the strategies, shared knowledge, and coordination that let networks of initiatives
    act coherently across their territory.

approach: >-
  Most regenerative work is stronger than the conditions around it. Projects that should
  reinforce each other operate in isolation. Ecological and social goals run on separate tracks.
  Financial systems designed for a different era can't sustain transitions that take decades.
  We work on those conditions — the strategies, shared knowledge, and coordination between
  initiatives — because that is where regeneration either compounds or stalls.

whatWeDoIntro: >-
  We work on the connective layer of regeneration: financial strategies designed for landscape
  scale, knowledge systems networks can actually use, and the coordination that lets initiatives
  act together across their territory.

pillars:
  - key: tissue
    badge: Network coordination
    title: Weave the relationships and programs that make a territory coherent
    intro: >-
      Regenerative transitions are coordination problems before they are anything else. We weave
      bioregional networks, and we design and run the funding and capacity-building programs
      that give them shared rhythm and direction.
    services:
      - name: Bioregional network weaving & sensemaking
        body: >-
          We map and convene the actors of a territory — cooperatives, initiatives, institutions —
          and build the shared picture and the working rhythms that let them recognize each other
          as part of one movement and act like it, grounded in our ongoing work across Catalunya.
      - name: Funding & capacity-building programs
        body: >-
          We design and run programs end-to-end that pair capital with capacity — like Regenerant
          Catalunya, which pooled local and global funding and routed it directly to a cohort of
          local regenerative projects through a shared treasury our partners co-operate.
  - key: neural
    badge: Collective intelligence
    title: Make knowledge something a whole network can use
    intro: >-
      Networks can't align around what they can't see. We design and maintain the knowledge
      infrastructure — bases, maps, and dashboards — that turns scattered material into a commons
      a whole territory can build on.
    services:
      - name: Complex research & visualizations
        body: >-
          Place-based research, social systems mapping, and visualization that make a territory
          legible — living outputs partners can revise together, not a report that goes stale the
          moment it's delivered.
      - name: Collective knowledge infrastructure
        body: >-
          Design and maintenance of linked knowledge bases, maps, and dashboards a network can
          build on and revise together — made for collective editing and complex decisions, not
          one drive or one person's memory. In production today with partners like Commonland,
          Bioregional Weaving Labs, and bioregioning.earth.
  - key: flow
    badge: Regenerative finance
    title: Finance transitions at the pace and scale regeneration needs
    intro: >-
      The financial systems that exist weren't built to sustain territorial regeneration. We
      design and run alternatives — BioFi and landscape-scale strategies, and the collective
      financial infrastructures that carry them — that reward systemic outcomes, not isolated
      outputs.
    services:
      - name: BioFi & landscape-scale finance strategy
        body: >-
          Design, execution, and coordination of landscape-scale financial strategies — from
          diagnosis to investment architecture — working with the people who hold the land and
          the communities on it. We practice this today alongside landscape partners like
          Commonland.
      - name: Collective financial infrastructures
        body: >-
          Design and implementation of the financial vehicles a network owns together — from
          shared treasuries to bioregional investment cooperatives — with governance that keeps
          capital accountable to the territory, never the other way around.

whatWeDoCta:
  title: Working across a territory or network?
  body: >-
    We help initiatives move from isolated projects to shared strategies — finance, knowledge,
    and coordination designed for the scale of regeneration.

projectsIntro: >-
  Work we've done at the connective layer — funding programs, network coordination, and
  territorial sensemaking across Catalonia and beyond.

projects:
  - heading: Territorial grantmaking locals can trust — and verify
    name: Regenerant Catalunya
    image: /assets/projects/regenerant-catalunya-montserrat-dusk.jpg
    pillars: [tissue, flow]
    excerpt: >-
      A territorial funding program we designed and operated for a global matching-funds round —
      pooling capital from Catalan donors and global matchers, then distributing it to local
      regenerative projects through a cooperative shared treasury.
    href: /projects/regenerant-catalunya/
  - heading: An interactive map of who is regenerating Catalunya
    name: Regenerant Catalunya Maps
    image: /assets/ecosystem_map.png
    pillars: [neural]
    excerpt: >-
      A collaborative, searchable map of the organizations, programs, and events working toward
      a regenerative Catalunya — 179+ entities mapped and growing, built on the same data
      commons that powers our knowledge work.
    href: https://motiuorg.github.io/Regenerant-Catalunya-Maps/
    external: true
  - heading: A portfolio view the whole network can orient around
    name: Bioregional Weaving Labs
    image: /assets/projects/bioregional-weaving-labs-map.png
    pillars: [neural, tissue]
    excerpt: >-
      We structured BWL's portfolio of place-based labs — relationships, programs, geographies,
      funding status — then built portfolio views and maps that let stewards compare initiatives
      without collapsing local context.
    href: /projects/bwl-portfolio-mapping/
  - heading: Making a bioregion legible for collective decisions
    name: Bioregional Intelligence
    image: /assets/projects/bioregional-intelligence-map.png
    pillars: [neural]
    excerpt: >-
      Our research and visualization surface for territorial sensemaking — interactive maps and
      dashboards that show how initiatives, institutions, and landscapes relate across a
      bioregion. Built for complex, collective decision-making.
    href: /atlas/
  - heading: Stewarded knowledge for a high-steppe landscape
    name: Altiplano Estepario
    image: /assets/projects/altiplano-estepario-reservoir.jpg
    pillars: [neural, tissue]
    excerpt: >-
      A stewarded knowledge commons for one of Europe's largest semi-arid landscapes —
      documenting regeneration practice, local actors, and water stewardship across the Iberian
      southeast.
    href: https://andrea-diome.github.io/altiplano-estepario
    external: true

whoWeWorkWithIntro: >-
  Organizations, networks, and institutions that see ecological and social health as inseparable —
  and understand that their work needs to operate systemically to affect real change.

audiences:
  - name: Cooperatives & solidarity economies
    body: >-
      You build through cooperative and solidarity structures — and need connective infrastructure
      that fits democratic ownership, not tools designed for extractive scale.
  - name: Bioeconomy & regenerative agriculture
    body: >-
      Your work crosses landscapes and supply chains, and you need coordination that links rural
      stewards and urban food actors without flattening either context.
  - name: Nature restoration initiatives
    body: >-
      Your restoration only holds when the communities on the land shape governance and
      livelihoods — we work with initiatives that treat ecology and social fabric as one problem.
  - name: Local & regional governments
    body: >-
      You steward public institutions watching a regenerative transition take shape — and want to
      align programs and partners around it without smothering what's already emerging.
  - name: Institutions at territory scale
    body: >-
      You work at watershed or bioregional scale, where place, social fabric, and ecological
      health have to be designed together — not handed off to separate silos.
  - name: Global networks & researchers
    body: >-
      You're part of a federation or research community testing regenerative finance and
      governance — and need a local node that bridges cooperative practice on the ground with
      network-scale infrastructure.

teamIntro: >-
  Three operators building the cooperative at Bloc4, Barcelona — working across coordination,
  sensemaking, and regenerative finance.

