audiences:
  - name: Bioeconomía y agricultura regenerativa
    body: >-
      Coordinamos a agricultores, productores y transformadores de una cadena de valor
      regenerativa en carteras que pueden financiarse y escalarse juntas.
  - name: Iniciativas de restauración de la naturaleza
    body: >-
      Mapeamos los sistemas ecológicos y sociales de un paisaje, y luego construimos los modelos
      de gobernanza y financiación que permiten que la restauración se sostenga a largo plazo,
      con participación real de las comunidades de la tierra.
  - name: Gobiernos locales y regionales
    body: >-
      Coordinamos los programas y socios que ya impulsan una transición regenerativa en un
      territorio, para que se mantenga cohesionada.
  - name: Organizaciones de desarrollo económico
    body: >-
      Adoptamos un enfoque holístico del desarrollo — mapeando lo que hay sobre el terreno y
      construyendo la infraestructura de coordinación que permite a las iniciativas actuar como
      un solo ecosistema y crecer juntas.
  - name: Redes globales e investigadoras
    body: >-
      Seguimos, mapeamos y visualizamos la cartera completa de iniciativas de una red — la
      infraestructura que investigadores y gestores necesitan para ver el conjunto y comparar qué
      funciona.
  - name: Financiadores de impacto
    body: >-
      Conectamos financiadores con carteras de proyectos con y sin ánimo de lucro que regeneran
      paisajes de manera holística — evaluadas, coordinadas y listas para financiar.

teamIntro: >-
  Un equipo pequeño con base en Barcelona, con socios y colaboradores en todo el mundo.

team:
  - name: Andrea Farias
    role: Estrategia y diseño de programas
    bio: >-
      Andrea aporta una formación en investigación y diseño a la gobernanza biorregional y las
      finanzas regenerativas — construyendo la infraestructura que esta transición necesita.
  - name: Giulio Quarta
    role: Operaciones, alianzas y comunidad
    bio: >-
      Desarrollo de alianzas, coordinación comunitaria y la columna operativa que mantiene los
      programas y las redes en funcionamiento.

